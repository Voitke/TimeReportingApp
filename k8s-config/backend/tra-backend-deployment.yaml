apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: tra-backend:0.0.1
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: tra-backend-config
            - secretRef:
                name: tra-backend-secrets