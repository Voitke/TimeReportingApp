apiVersion: v1
kind: Config
clusters:
- name: tra-cluster
  cluster:
    server: https://localhost:6443
    # insecure-skip-tls-verify: true            # Uncomment to skip TLS verification (not recommended)
    certificate-authority-data: BASE64_CERT     # Base64-encoded CA certificate
users:
- name: kube-admin
  user:
    token: YOUR_BEARER_TOKEN                     # Authentication token
    client-certificate-data: BASE64_CLIENT_CERT  # Base64-encoded client certificate
    client-key-data: BASE64_CLIENT_KEY           # Base64-encoded client key
contexts:
- name: tra-context
  context:
    cluster: tra-cluster
    user: kube-admin
current-context: tra-context